<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C# Quiz — Проверь свои знания</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #6c5ce7;
    --primary-dark: #5a4bd1;
    --primary-light: #a29bfe;
    --accent: #00cec9;
    --success: #00b894;
    --danger: #e17055;
    --warning: #fdcb6e;
    --dark: #2d3436;
    --light-bg: #f8f9fe;
    --card-bg: #ffffff;
    --text-muted: #6c7a89;
  }

  * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--light-bg);
    color: var(--dark);
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0, 206, 201, 0.08) 0%, transparent 40%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    padding: 20px 0;
  }

  .app-container {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  /* === Glass Card === */
  .glass-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 
      0 20px 60px rgba(108, 92, 231, 0.15),
      0 8px 20px rgba(0, 0, 0, 0.05);
    padding: 2.5rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  @media (max-width: 576px) {
    .glass-card { padding: 1.5rem; border-radius: 20px; }
  }

  /* === Screens === */
  .screen {
    display: none;
    animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .screen.active { display: block; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === Header / Title === */
  .app-title {
    font-weight: 800;
    font-size: 2.5rem;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
  }

  .app-subtitle {
    color: var(--text-muted);
    font-size: 1.05rem;
    font-weight: 400;
  }

  /* === Logo Badge === */
  .logo-badge {
    width: 90px;
    height: 90px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    color: white;
    box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
    margin-bottom: 1.5rem;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* === Buttons === */
  .btn-gradient {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border: none;
    color: white;
    font-weight: 600;
    padding: 0.85rem 2.5rem;
    border-radius: 14px;
    font-size: 1.05rem;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(108, 92, 231, 0.35);
  }

  .btn-gradient:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(108, 92, 231, 0.45);
    color: white;
  }

  .btn-gradient:active { transform: translateY(0); }

  .btn-outline-soft {
    border: 2px solid rgba(108, 92, 231, 0.2);
    color: var(--primary);
    font-weight: 600;
    padding: 0.7rem 1.8rem;
    border-radius: 14px;
    background: transparent;
    transition: all 0.3s ease;
  }

  .btn-outline-soft:hover {
    background: rgba(108, 92, 231, 0.08);
    border-color: var(--primary);
    color: var(--primary-dark);
  }

  /* === Info chips on start screen === */
  .info-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(108, 92, 231, 0.08);
    color: var(--primary-dark);
    padding: 0.5rem 1.1rem;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 500;
    margin: 0.25rem;
  }

  .info-chip i { font-size: 1.1rem; }

  /* === Quiz Header === */
  .quiz-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .question-counter {
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  .question-counter strong { color: var(--primary); font-size: 1.15rem; }

  .timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    padding: 0.55rem 1.2rem;
    border-radius: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
    font-size: 1rem;
  }

  .timer-badge.warning {
    background: linear-gradient(135deg, var(--danger), #ff7675);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 20px rgba(225, 112, 85, 0.3); }
    50% { box-shadow: 0 8px 30px rgba(225, 112, 85, 0.6); }
  }

  /* === Progress bar === */
  .progress-wrapper { margin-bottom: 2rem; }
  .progress {
    height: 10px;
    border-radius: 10px;
    background: rgba(108, 92, 231, 0.1);
  }
  .progress-bar {
    background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* === Question === */
  .question-text {
    font-size: 1.35rem;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 1.75rem;
    color: var(--dark);
  }

  .code-snippet {
    font-family: 'JetBrains Mono', monospace;
    background: #1e1e2e;
    color: #cdd6f4;
    padding: 1rem 1.25rem;
    border-radius: 12px;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    overflow-x: auto;
    border-left: 4px solid var(--primary);
  }

  /* === Answer options === */
  .answer-option {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.1rem 1.4rem;
    background: white;
    border: 2px solid #e8e8f0;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 0.85rem;
    font-weight: 500;
    position: relative;
    overflow: hidden;
  }

  .answer-option:hover {
    border-color: var(--primary-light);
    transform: translateX(4px);
    box-shadow: 0 6px 20px rgba(108, 92, 231, 0.12);
  }

  .answer-option.selected {
    border-color: var(--primary);
    background: linear-gradient(135deg, rgba(108, 92, 231, 0.06), rgba(0, 206, 201, 0.06));
    box-shadow: 0 8px 25px rgba(108, 92, 231, 0.2);
  }

  .answer-option.selected .option-letter {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    transform: scale(1.05);
  }

  .option-letter {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 10px;
    background: #f1f2f6;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    transition: all 0.25s ease;
    font-size: 0.95rem;
  }

  .answer-option.correct {
    border-color: var(--success);
    background: rgba(0, 184, 148, 0.08);
  }
  .answer-option.correct .option-letter { background: var(--success); color: white; }

  .answer-option.wrong {
    border-color: var(--danger);
    background: rgba(225, 112, 85, 0.08);
  }
  .answer-option.wrong .option-letter { background: var(--danger); color: white; }

  .answer-option.disabled {
    pointer-events: none;
    opacity: 0.75;
  }

  /* === Nav buttons === */
  .quiz-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.5rem;
    gap: 1rem;
  }

  /* === Result Screen === */
  .result-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: conic-gradient(var(--primary) 0deg, #eee 0deg);
    transition: background 1s ease;
  }

  .result-circle::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: white;
  }

  .result-circle .score-value {
    position: relative;
    z-index: 1;
    font-size: 2.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .result-circle .score-label {
    position: relative;
    z-index: 1;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 4px;
  }

  .result-message {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .stat-box {
    background: #f8f9fe;
    border-radius: 16px;
    padding: 1.2rem;
    text-align: center;
    border: 1px solid #eee;
  }
  .stat-box .stat-value {
    font-size: 1.8rem;
    font-weight: 800;
    line-height: 1.2;
  }
  .stat-box .stat-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-top: 4px;
  }

  /* === Review list === */
  .review-item {
    display: flex;
    gap: 12px;
    padding: 1rem;
    border-radius: 12px;
    background: #f8f9fe;
    margin-bottom: 0.75rem;
    border-left: 4px solid var(--success);
  }
  .review-item.fail { border-left-color: var(--danger); }

  .review-icon {
    width: 30px;
    height: 30px;
    min-width: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.9rem;
  }
  .review-icon.ok { background: var(--success); }
  .review-icon.no { background: var(--danger); }

  .review-q { font-weight: 600; font-size: 0.92rem; margin-bottom: 2px; }
  .review-a { font-size: 0.82rem; color: var(--text-muted); }
  .review-a span { color: var(--success); font-weight: 600; }
  .review-item.fail .review-a .correct-ans { color: var(--success); }

  /* === Confetti canvas === */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
  }

  .fade-in { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

  ::selection { background: var(--primary-light); color: white; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="container app-container">

  <!-- ==================== START SCREEN ==================== -->
  <div id="startScreen" class="screen active">
    <div class="glass-card text-center">
      <div class="logo-badge">
        <i class="bi bi-braces-asterisk"></i>
      </div>
      <h1 class="app-title mb-2">C# Knowledge Quiz</h1>
      <p class="app-subtitle mb-4">Проверь свои знания по языку C# — от основ до продвинутых тем</p>

      <div class="mb-4">
        <span class="info-chip"><i class="bi bi-list-check"></i> 10 вопросов</span>
        <span class="info-chip"><i class="bi bi-clock"></i> 5 минут</span>
        <span class="info-chip"><i class="bi bi-lightning-charge"></i> 1 попытка</span>
      </div>

      <div class="alert border-0 mb-4" style="background: rgba(253, 203, 110, 0.15); color: #b8860b; border-radius: 14px; font-size: 0.9rem;">
        <i class="bi bi-info-circle me-2"></i>
        Выберите один правильный ответ из четырёх вариантов. В конце вы увидите подробный разбор.
      </div>

      <button class="btn btn-gradient btn-lg" onclick="startQuiz()">
        <i class="bi bi-play-fill me-2"></i>Начать тестирование
      </button>
    </div>
  </div>

  <!-- ==================== QUIZ SCREEN ==================== -->
  <div id="quizScreen" class="screen">
    <div class="glass-card">
      <!-- Top bar -->
      <div class="quiz-topbar">
        <div class="question-counter">
          Вопрос <strong id="currentQ">1</strong> / <span id="totalQ">10</span>
        </div>
        <div class="timer-badge" id="timerBadge">
          <i class="bi bi-clock-history"></i>
          <span id="timerText">05:00</span>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-wrapper">
        <div class="progress">
          <div id="progressBar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Question -->
      <div id="questionContainer">
        <div class="question-text" id="questionText"></div>
        <div id="codeBlock"></div>
        <div id="answersContainer"></div>
      </div>

      <!-- Navigation -->
      <div class="quiz-nav">
        <button class="btn btn-outline-soft" id="prevBtn" onclick="prevQuestion()">
          <i class="bi bi-arrow-left me-1"></i>Назад
        </button>
        <button class="btn btn-gradient" id="nextBtn" onclick="nextQuestion()">
          Далее<i class="bi bi-arrow-right ms-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== RESULT SCREEN ==================== -->
  <div id="resultScreen" class="screen">
    <div class="glass-card text-center">
      <div class="result-circle" id="resultCircle">
        <div class="score-value" id="scoreValue">0%</div>
        <div class="score-label">результат</div>
      </div>

      <h2 class="result-message" id="resultMessage">Отличная работа!</h2>
      <p class="app-subtitle mb-4" id="resultSubtitle"></p>

      <div class="row g-3 mb-4">
        <div class="col-4">
          <div class="stat-box">
            <div class="stat-value" style="color: var(--success)" id="statCorrect">0</div>
            <div class="stat-label">Верно</div>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-box">
            <div class="stat-value" style="color: var(--danger)" id="statWrong">0</div>
            <div class="stat-label">Ошибок</div>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-box">
            <div class="stat-value" style="color: var(--primary)" id="statTime">0:00</div>
            <div class="stat-label">Время</div>
          </div>
        </div>
      </div>

      <div class="text-start mb-4">
        <h6 class="fw-bold mb-3"><i class="bi bi-list-check me-2"></i>Разбор ответов</h6>
        <div id="reviewList"></div>
      </div>

      <button class="btn btn-gradient" onclick="restartQuiz()">
        <i class="bi bi-arrow-clockwise me-2"></i>Пройти заново
      </button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================================
   ВОПРОСЫ
   ============================================================ */
const questions = [
  {
    q: "Какой тип данных в C# используется для хранения целых чисел?",
    answers: ["int", "string", "bool", "double"],
    correct: 0
  },
  {
    q: "Что выведет следующий код?",
    code: `int x = 5;\nConsole.WriteLine(x++ + ++x);`,
    answers: ["12", "11", "13", "10"],
    correct: 0
  },
  {
    q: "Какое ключевое слово используется для наследования класса в C#?",
    answers: ["extends", "inherits", ":", "implements"],
    correct: 2
  },
  {
    q: "Что такое `Nullable<int>`?",
    answers: [
      "Тип, который может хранить значение или null",
      "Ссылочный тип",
      "Массив целых чисел",
      "Строка с числом"
    ],
    correct: 0
  },
  {
    q: "Какой модификатор доступа делает член класса доступным только внутри этого класса?",
    answers: ["public", "protected", "internal", "private"],
    correct: 3
  },
  {
    q: "Что делает оператор `??` в C#?",
    answers: [
      "Проверяет равенство",
      "Возвращает левый операнд, если он не null, иначе правый",
      "Логическое ИЛИ",
      "Тернарный оператор"
    ],
    correct: 1
  },
  {
    q: "Какой интерфейс должен реализовать класс для использования в `foreach`?",
    answers: ["IComparable", "IEnumerable", "IDisposable", "ICloneable"],
    correct: 1
  },
  {
    q: "Что означает ключевое слово `async` в C#?",
    answers: [
      "Метод выполняется в отдельном потоке",
      "Метод может содержать `await` и выполняться асинхронно",
      "Метод блокирует вызывающий поток",
      "Метод является статическим"
    ],
    correct: 1
  },
  {
    q: "Какой результат выполнения кода?",
    code: `string s = null;\nConsole.WriteLine(s?.Length);`,
    answers: ["0", "NullReferenceException", "null", "Ошибка компиляции"],
    correct: 2
  },
  {
    q: "Что такое `record` в C#?",
    answers: [
      "Ссылочный тип для неизменяемых данных с автогенерируемым равенством",
      "Структура для хранения массива",
      "Аналог `class` без методов",
      "Тип для работы с файлами"
    ],
    correct: 0
  }
];

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let currentIndex = 0;
let answers = new Array(questions.length).fill(null);
let timeLeft = 300; // 5 минут
let timerInterval = null;
let quizStartTime = 0;
let quizFinished = false;

/* ============================================================
   ЭЛЕМЕНТЫ
   ============================================================ */
const screens = {
  start: document.getElementById('startScreen'),
  quiz: document.getElementById('quizScreen'),
  result: document.getElementById('resultScreen')
};

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   СТАРТ
   ============================================================ */
function startQuiz() {
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  timeLeft = 300;
  quizFinished = false;
  quizStartTime = Date.now();

  document.getElementById('totalQ').textContent = questions.length;
  showScreen('quiz');
  renderQuestion();
  startTimer();
}

/* ============================================================
   ТАЙМЕР
   ============================================================ */
function startTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      finishQuiz();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const s = (timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('timerText').textContent = `${m}:${s}`;
  const badge = document.getElementById('timerBadge');
  if (timeLeft <= 60) badge.classList.add('warning');
  else badge.classList.remove('warning');
}

/* ============================================================
   РЕНДЕР ВОПРОСА
   ============================================================ */
function renderQuestion() {
  const q = questions[currentIndex];

  // счётчик + прогресс
  document.getElementById('currentQ').textContent = currentIndex + 1;
  const progress = ((currentIndex) / questions.length) * 100;
  document.getElementById('progressBar').style.width = progress + '%';

  // текст
  document.getElementById('questionText').textContent = q.q;

  // код
  const codeBlock = document.getElementById('codeBlock');
  codeBlock.innerHTML = q.code
    ? `<div class="code-snippet"><pre class="mb-0" style="white-space:pre-wrap;">${escapeHtml(q.code)}</pre></div>`
    : '';

  // ответы
  const answersContainer = document.getElementById('answersContainer');
  answersContainer.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.answers.forEach((ans, i) => {
    const div = document.createElement('div');
    div.className = 'answer-option';
    if (answers[currentIndex] === i) div.classList.add('selected');
    div.innerHTML = `
      <div class="option-letter">${letters[i]}</div>
      <div class="flex-grow-1">${escapeHtml(ans)}</div>
      <i class="bi bi-check-circle-fill" style="opacity:0; color: var(--primary); transition: opacity .2s;"></i>
    `;
    if (answers[currentIndex] === i) {
      div.querySelector('i').style.opacity = '1';
    }
    div.addEventListener('click', () => selectAnswer(i));
    answersContainer.appendChild(div);
  });

  // кнопки навигации
  document.getElementById('prevBtn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('nextBtn');
  if (currentIndex === questions.length - 1) {
    nextBtn.innerHTML = 'Завершить<i class="bi bi-check-lg ms-1"></i>';
  } else {
    nextBtn.innerHTML = 'Далее<i class="bi bi-arrow-right ms-1"></i>';
  }

  // анимация появления
  const qc = document.getElementById('questionContainer');
  qc.classList.remove('fade-in');
  void qc.offsetWidth;
  qc.classList.add('fade-in');
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ============================================================
   ВЫБОР ОТВЕТА
   ============================================================ */
function selectAnswer(index) {
  if (quizFinished) return;
  answers[currentIndex] = index;

  // обновить UI
  const opts = document.querySelectorAll('#answersContainer .answer-option');
  opts.forEach((el, i) => {
    el.classList.toggle('selected', i === index);
    const icon = el.querySelector('i');
    if (icon) icon.style.opacity = i === index ? '1' : '0';
  });
}

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

/* ============================================================
   ЗАВЕРШЕНИЕ
   ============================================================ */
function finishQuiz() {
  if (quizFinished) return;
  quizFinished = true;
  clearInterval(timerInterval);

  const spentTime = Math.min(300, Math.round((Date.now() - quizStartTime) / 1000));

  let correct = 0;
  answers.forEach((ans, i) => {
    if (ans === questions[i].correct) correct++;
  });

  const total = questions.length;
  const percent = Math.round((correct / total) * 100);

  // Заполняем результат
  const scoreValue = document.getElementById('scoreValue');
  scoreValue.textContent = percent + '%';

  const circle = document.getElementById('resultCircle');
  setTimeout(() => {
    circle.style.background = `conic-gradient(
      var(--primary) 0deg,
      var(--accent) ${percent * 3.6}deg,
      #eee ${percent * 3.6}deg,
      #eee 360deg
    )`;
  }, 100);

  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = total - correct;
  const mm = Math.floor(spentTime / 60);
  const ss = (spentTime % 60).toString().padStart(2, '0');
  document.getElementById('statTime').textContent = `${mm}:${ss}`;

  // Сообщение
  const msgEl = document.getElementById('resultMessage');
  const subEl = document.getElementById('resultSubtitle');
  let msg, sub, color;
  if (percent >= 90) {
    msg = '🏆 Превосходно!';
    sub = 'Ты настоящий эксперт по C#. Так держать!';
    color = 'var(--success)';
    launchConfetti();
  } else if (percent >= 70) {
    msg = '🎉 Отличный результат!';
    sub = 'Хорошие знания! Есть куда расти — продолжай практиковаться.';
    color = 'var(--primary)';
    launchConfetti();
  } else if (percent >= 50) {
    msg = '👍 Неплохо!';
    sub = 'Базовые знания есть, но стоит повторить материал.';
    color = 'var(--warning)';
  } else {
    msg = '📚 Нужно подтянуть теорию';
    sub = 'Не расстраивайся — повтори основы C# и попробуй снова!';
    color = 'var(--danger)';
  }
  msgEl.textContent = msg;
  msgEl.style.color = color;
  subEl.textContent = sub;

  // Разбор
  renderReview();

  showScreen('result');
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  questions.forEach((q, i) => {
    const userAnswer = answers[i];
    const isCorrect = userAnswer === q.correct;
    const item = document.createElement('div');
    item.className = 'review-item' + (isCorrect ? '' : ' fail');

    const userText = userAnswer !== null
      ? `${letters[userAnswer]}. ${q.answers[userAnswer]}`
      : '— не выбран —';

    const correctText = `${letters[q.correct]}. ${q.answers[q.correct]}`;

    item.innerHTML = `
      <div class="review-icon ${isCorrect ? 'ok' : 'no'}">
        <i class="bi bi-${isCorrect ? 'check-lg' : 'x-lg'}"></i>
      </div>
      <div class="flex-grow-1">
        <div class="review-q">${i + 1}. ${escapeHtml(q.q)}</div>
        <div class="review-a">
          Ваш ответ: ${escapeHtml(userText)}
          ${!isCorrect ? `<br>Правильный: <span class="correct-ans">${escapeHtml(correctText)}</span>` : ''}
        </div>
      </div>
    `;
    list.appendChild(item);
  });
}

/* ============================================================
   РЕСТАРТ
   ============================================================ */
function restartQuiz() {
  showScreen('start');
}

/* ============================================================
   CONFETTI 🎊
   ============================================================ */
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#6c5ce7', '#00cec9', '#a29bfe', '#fdcb6e', '#00b894', '#e17055'];
  const pieces = [];
  for (let i = 0; i < 140; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      w: 6 + Math.random() * 8,
      h: 8 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: 2 + Math.random() * 4,
      vx: -1.5 + Math.random() * 3,
      rot: Math.random() * Math.PI,
      vr: -0.15 + Math.random() * 0.3
    });
  }

  let frame = 0;
  const maxFrames = 260;

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < maxFrames) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  animate();
}

/* ============================================================
   Клавиатура
   ============================================================ */
document.addEventListener('keydown', e => {
  if (!screens.quiz.classList.contains('active')) return;
  if (e.key === 'ArrowRight') nextQuestion();
  if (e.key === 'ArrowLeft') prevQuestion();
  const n = parseInt(e.key);
  if (n >= 1 && n <= 4) selectAnswer(n - 1);
});

window.addEventListener('resize', () => {
  const canvas = document.getElementById('confetti');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
