<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C# Quiz — вопросы из Google Таблицы</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #6c5ce7; --primary-dark: #5a4bd1; --primary-light: #a29bfe;
    --accent: #00cec9; --success: #00b894; --danger: #e17055; --warning: #fdcb6e;
    --dark: #2d3436; --light-bg: #f8f9fe; --text-muted: #6c7a89;
  }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: 'Inter', sans-serif; background: var(--light-bg); color: var(--dark);
    min-height: 100vh; background-image:
      radial-gradient(circle at 10% 20%, rgba(108,92,231,.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(0,206,201,.08) 0%, transparent 40%);
    background-attachment: fixed; display: flex; align-items: center; padding: 20px 0;
  }
  .app-container { max-width: 820px; width: 100%; margin: 0 auto; }
  .glass-card {
    background: rgba(255,255,255,.85); backdrop-filter: blur(20px);
    border-radius: 24px; border: 1px solid rgba(255,255,255,.6);
    box-shadow: 0 20px 60px rgba(108,92,231,.15), 0 8px 20px rgba(0,0,0,.05);
    padding: 2.5rem; transition: transform .3s ease, box-shadow .3s ease;
  }
  @media (max-width: 576px) { .glass-card { padding: 1.5rem; border-radius: 20px; } }

  .screen { display: none; animation: fadeInUp .5s cubic-bezier(.16,1,.3,1); }
  .screen.active { display: block; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .app-title {
    font-weight: 800; font-size: 2.5rem;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    letter-spacing: -1px;
  }
  .app-subtitle { color: var(--text-muted); font-size: 1.05rem; font-weight: 400; }

  .logo-badge {
    width: 90px; height: 90px; border-radius: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 2.8rem; color: white;
    box-shadow: 0 15px 40px rgba(108,92,231,.4); margin-bottom: 1.5rem;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .btn-gradient {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border: none; color: white; font-weight: 600; padding: .85rem 2.5rem;
    border-radius: 14px; font-size: 1.05rem; transition: all .3s ease;
    box-shadow: 0 10px 25px rgba(108,92,231,.35);
  }
  .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(108,92,231,.45); color: white; }
  .btn-gradient:active { transform: translateY(0); }
  .btn-gradient:disabled { opacity: .7; transform: none; cursor: wait; }

  .btn-outline-soft {
    border: 2px solid rgba(108,92,231,.2); color: var(--primary); font-weight: 600;
    padding: .7rem 1.8rem; border-radius: 14px; background: transparent; transition: all .3s ease;
  }
  .btn-outline-soft:hover { background: rgba(108,92,231,.08); border-color: var(--primary); color: var(--primary-dark); }

  .info-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(108,92,231,.08); color: var(--primary-dark);
    padding: .5rem 1.1rem; border-radius: 30px; font-size: .9rem; font-weight: 500; margin: .25rem;
  }

  .quiz-topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .question-counter { font-weight: 600; color: var(--text-muted); font-size: .95rem; }
  .question-counter strong { color: var(--primary); font-size: 1.15rem; }

  .timer-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white; padding: .55rem 1.2rem; border-radius: 30px;
    font-weight: 600; font-variant-numeric: tabular-nums;
    box-shadow: 0 8px 20px rgba(108,92,231,.3); font-size: 1rem;
  }
  .timer-badge.warning { background: linear-gradient(135deg, var(--danger), #ff7675); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 8px 20px rgba(225,112,85,.3); } 50% { box-shadow: 0 8px 30px rgba(225,112,85,.6); } }

  .progress-wrapper { margin-bottom: 2rem; }
  .progress { height: 10px; border-radius: 10px; background: rgba(108,92,231,.1); }
  .progress-bar { background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%); border-radius: 10px; transition: width .5s cubic-bezier(.16,1,.3,1); }

  .topic-badge {
    display: inline-block; background: rgba(0,206,201,.15); color: #008b87;
    padding: .3rem .9rem; border-radius: 20px; font-size: .8rem; font-weight: 600;
    margin-bottom: .75rem; text-transform: uppercase; letter-spacing: .5px;
  }
  .question-text { font-size: 1.35rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.75rem; color: var(--dark); }

  .code-snippet {
    font-family: 'JetBrains Mono', monospace; background: #1e1e2e; color: #cdd6f4;
    padding: 1rem 1.25rem; border-radius: 12px; font-size: .9rem; margin-bottom: 1.5rem;
    overflow-x: auto; border-left: 4px solid var(--primary);
  }

  .answer-option {
    display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.4rem;
    background: white; border: 2px solid #e8e8f0; border-radius: 16px;
    cursor: pointer; transition: all .25s ease; margin-bottom: .85rem;
    font-weight: 500; position: relative; overflow: hidden;
  }
  .answer-option:hover { border-color: var(--primary-light); transform: translateX(4px); box-shadow: 0 6px 20px rgba(108,92,231,.12); }
  .answer-option.selected { border-color: var(--primary); background: linear-gradient(135deg, rgba(108,92,231,.06), rgba(0,206,201,.06)); box-shadow: 0 8px 25px rgba(108,92,231,.2); }
  .answer-option.selected .option-letter { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; transform: scale(1.05); }
  .option-letter {
    width: 36px; height: 36px; min-width: 36px; border-radius: 10px; background: #f1f2f6;
    color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    font-weight: 700; transition: all .25s ease; font-size: .95rem;
  }

  .quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }

  .result-circle {
    width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 1.5rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; background: conic-gradient(var(--primary) 0deg, #eee 0deg); transition: background 1s ease;
  }
  .result-circle::before { content: ''; position: absolute; inset: 12px; border-radius: 50%; background: white; }
  .result-circle .score-value {
    position: relative; z-index: 1; font-size: 2.8rem; font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1;
  }
  .result-circle .score-label { position: relative; z-index: 1; font-size: .85rem; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

  .result-message { font-size: 1.4rem; font-weight: 700; margin-bottom: .5rem; }
  .stat-box { background: #f8f9fe; border-radius: 16px; padding: 1.2rem; text-align: center; border: 1px solid #eee; }
  .stat-box .stat-value { font-size: 1.8rem; font-weight: 800; line-height: 1.2; }
  .stat-box .stat-label { font-size: .8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; margin-top: 4px; }

  .review-item {
    display: flex; gap: 12px; padding: 1rem; border-radius: 12px;
    background: #f8f9fe; margin-bottom: .75rem; border-left: 4px solid var(--success);
  }
  .review-item.fail { border-left-color: var(--danger); }
  .review-icon { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: .9rem; }
  .review-icon.ok { background: var(--success); }
  .review-icon.no { background: var(--danger); }
  .review-q { font-weight: 600; font-size: .92rem; margin-bottom: 2px; }
  .review-a { font-size: .82rem; color: var(--text-muted); }
  .review-a span.correct-ans { color: var(--success); font-weight: 600; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }
  .fade-in { animation: fadeInUp .5s cubic-bezier(.16,1,.3,1); }
  ::selection { background: var(--primary-light); color: white; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="container app-container">

  <!-- START -->
  <div id="startScreen" class="screen active">
    <div class="glass-card text-center">
      <div class="logo-badge"><i class="bi bi-braces-asterisk"></i></div>
      <h1 class="app-title mb-2">C# Knowledge Quiz</h1>
      <p class="app-subtitle mb-4">Проверь свои знания по языку C# — вопросы загружаются из Google Таблицы</p>

      <div class="mb-4">
        <span class="info-chip"><i class="bi bi-list-check"></i> <span id="chipCount">Вопросы</span></span>
        <span class="info-chip"><i class="bi bi-clock"></i> 5 минут</span>
        <span class="info-chip"><i class="bi bi-cloud-download"></i> Google Sheets</span>
      </div>

      <div id="statusBox" class="alert border-0 mb-4" style="background: rgba(108,92,231,.1); color: var(--primary-dark); border-radius: 14px; font-size: .9rem;">
        <i class="bi bi-info-circle me-2"></i>
        Вопросы будут загружены из опубликованной таблицы при нажатии на кнопку.
      </div>

      <button id="startBtn" class="btn btn-gradient btn-lg" onclick="startQuiz()">
        <i class="bi bi-play-fill me-2"></i>Начать тестирование
      </button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="screen">
    <div class="glass-card">
      <div class="quiz-topbar">
        <div class="question-counter">Вопрос <strong id="currentQ">1</strong> / <span id="totalQ">0</span></div>
        <div class="timer-badge" id="timerBadge">
          <i class="bi bi-clock-history"></i><span id="timerText">05:00</span>
        </div>
      </div>
      <div class="progress-wrapper">
        <div class="progress"><div id="progressBar" class="progress-bar" style="width: 0%"></div></div>
      </div>
      <div id="questionContainer">
        <div id="topicBadge"></div>
        <div class="question-text" id="questionText"></div>
        <div id="codeBlock"></div>
        <div id="answersContainer"></div>
      </div>
      <div class="quiz-nav">
        <button class="btn btn-outline-soft" id="prevBtn" onclick="prevQuestion()"><i class="bi bi-arrow-left me-1"></i>Назад</button>
        <button class="btn btn-gradient" id="nextBtn" onclick="nextQuestion()">Далее<i class="bi bi-arrow-right ms-1"></i></button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen">
    <div class="glass-card text-center">
      <div class="result-circle" id="resultCircle">
        <div class="score-value" id="scoreValue">0%</div>
        <div class="score-label">результат</div>
      </div>
      <h2 class="result-message" id="resultMessage"></h2>
      <p class="app-subtitle mb-4" id="resultSubtitle"></p>

      <div class="row g-3 mb-4">
        <div class="col-4"><div class="stat-box"><div class="stat-value" style="color: var(--success)" id="statCorrect">0</div><div class="stat-label">Верно</div></div></div>
        <div class="col-4"><div class="stat-box"><div class="stat-value" style="color: var(--danger)" id="statWrong">0</div><div class="stat-label">Ошибок</div></div></div>
        <div class="col-4"><div class="stat-box"><div class="stat-value" style="color: var(--primary)" id="statTime">0:00</div><div class="stat-label">Время</div></div></div>
      </div>

      <div class="text-start mb-4">
        <h6 class="fw-bold mb-3"><i class="bi bi-list-check me-2"></i>Разбор ответов</h6>
        <div id="reviewList"></div>
      </div>

      <button class="btn btn-gradient" onclick="restartQuiz()"><i class="bi bi-arrow-clockwise me-2"></i>Пройти заново</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ============================================================
   НАСТРОЙКИ
   ============================================================ */
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRjuydAEzL-YMLmog4EcvpNRdodHd3xHA7ks3bLHrrCeJvaexhR6k6NnD5MUKXUYyeHEQemf2pwOGGC/pub?output=tsv';

// Список CORS-прокси — пробуем по очереди
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
];

const TIME_LIMIT = 300; // 5 минут

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let questions = [];
let currentIndex = 0;
let answers = [];
let timeLeft = TIME_LIMIT;
let timerInterval = null;
let quizStartTime = 0;
let quizFinished = false;
let loading = false;

const screens = {
  start: document.getElementById('startScreen'),
  quiz: document.getElementById('quizScreen'),
  result: document.getElementById('resultScreen')
};

function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   ЗАГРУЗКА ИЗ GOOGLE SHEETS (TSV)
   ============================================================ */

/**
 * Скачивает TSV с фолбэком через несколько прокси.
 * Возвращает строку текста.
 */
async function fetchTSV(url) {
  let lastErr;
  for (const wrap of PROXIES) {
    const proxyUrl = wrap(url);
    try {
      const res = await fetch(proxyUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      // Проверяем, что это действительно таблица, а не HTML-ошибка прокси
      if (!text || text.length < 10 || /<html|<!doctype/i.test(text.slice(0, 200))) {
        throw new Error('Прокси вернул не таблицу');
      }
      return text;
    } catch (e) {
      lastErr = e;
      console.warn('Прокси не сработал:', proxyUrl, e.message);
    }
  }
  throw new Error('Не удалось загрузить таблицу ни через один прокси. ' + (lastErr?.message || ''));
}

/**
 * Парсер TSV с поддержкой кавычек, экранированных кавычек ("") и переводов строк внутри кавычек.
 */
function parseTSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];

    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === '\t') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* пропускаем CR */ }
      else { field += c; }
    }
  }
  // хвост
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/**
 * Из сырых строк делает массив вопросов в формате приложения.
 * Столбцы: 0=№, 1=Тема, 2=Вопрос, 3..6=Варианты, 7=Номер правильного (1..4)
 */
function rowsToQuestions(rows) {
  if (!rows.length) throw new Error('Таблица пустая');

  // Определяем, есть ли строка заголовка
  let start = 0;
  const first = rows[0].map(c => String(c).toLowerCase().trim());
  if (first.some(c => c.includes('вопрос') || c.includes('question') || c === '№')) {
    start = 1;
  }

  const result = [];
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    if (!r || r.length < 8) continue;

    const questionText = String(r[2] ?? '').trim();
    if (!questionText) continue;

    const options = [r[3], r[4], r[5], r[6]].map(v => String(v ?? '').trim());
    if (options.some(o => !o)) continue; // пропускаем неполные

    const correctRaw = String(r[7] ?? '').trim();
    const correctNum = parseInt(correctRaw, 10);

    // Допускаем и "1..4", и "0..3"
    let correctIdx;
    if (correctNum >= 1 && correctNum <= 4) correctIdx = correctNum - 1;
    else if (correctNum >= 0 && correctNum <= 3) correctIdx = correctNum;
    else continue; // невалидный номер — пропускаем

    result.push({
      topic: String(r[1] ?? '').trim(),
      q: questionText,
      answers: options,
      correct: correctIdx
    });
  }

  if (!result.length) throw new Error('В таблице не найдено валидных вопросов');
  return result;
}

async function loadQuestions() {
  const tsv = await fetchTSV(SHEET_URL);
  const rows = parseTSV(tsv);
  return rowsToQuestions(rows);
}

/* ============================================================
   СТАРТ
   ============================================================ */
async function startQuiz() {
  if (loading) return;
  loading = true;

  const btn = document.getElementById('startBtn');
  const status = document.getElementById('statusBox');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Загрузка вопросов…';
  status.className = 'alert border-0 mb-4';
  status.style.background = 'rgba(108,92,231,.1)';
  status.style.color = 'var(--primary-dark)';
  status.innerHTML = '<i class="bi bi-cloud-download me-2"></i>Загружаем вопросы из Google Таблицы…';

  try {
    questions = await loadQuestions();

    answers = new Array(questions.length).fill(null);
    currentIndex = 0;
    timeLeft = TIME_LIMIT;
    quizFinished = false;
    quizStartTime = Date.now();

    document.getElementById('totalQ').textContent = questions.length;
    document.getElementById('chipCount').textContent = questions.length + ' вопросов';

    status.style.background = 'rgba(0,184,148,.12)';
    status.style.color = '#008f72';
    status.innerHTML = `<i class="bi bi-check-circle me-2"></i>Загружено вопросов: <b>${questions.length}</b>`;

    showScreen('quiz');
    renderQuestion();
    startTimer();
  } catch (err) {
    console.error(err);
    status.className = 'alert alert-danger border-0 mb-4';
    status.innerHTML = `<i class="bi bi-exclamation-triangle me-2"></i>
      <b>Не удалось загрузить вопросы.</b><br>
      <small>${err.message}</small><br>
      <small class="d-block mt-2">Проверьте, что таблица опубликована (Файл → Поделиться → Опубликовать в интернете) с форматом TSV, и что ссылка открывается в браузере.</small>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-play-fill me-2"></i>Начать тестирование';
    loading = false;
  }
}

/* ============================================================
   ТАЙМЕР
   ============================================================ */
function startTimer() {
  clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) { clearInterval(timerInterval); finishQuiz(); }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
  const s = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
  document.getElementById('timerText').textContent = `${m}:${s}`;
  const badge = document.getElementById('timerBadge');
  badge.classList.toggle('warning', timeLeft <= 60);
}

/* ============================================================
   РЕНДЕР ВОПРОСА
   ============================================================ */
function renderQuestion() {
  if (!questions.length) return;
  const q = questions[currentIndex];

  document.getElementById('currentQ').textContent = currentIndex + 1;
  document.getElementById('progressBar').style.width = ((currentIndex) / questions.length * 100) + '%';

  document.getElementById('topicBadge').innerHTML = q.topic
    ? `<span class="topic-badge">${escapeHtml(q.topic)}</span>` : '';

  document.getElementById('questionText').textContent = q.q;
  document.getElementById('codeBlock').innerHTML = '';

  const answersContainer = document.getElementById('answersContainer');
  answersContainer.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];

  q.answers.forEach((ans, i) => {
    const div = document.createElement('div');
    div.className = 'answer-option';
    if (answers[currentIndex] === i) div.classList.add('selected');
    div.innerHTML = `
      <div class="option-letter">${letters[i]}</div>
      <div class="flex-grow-1">${escapeHtml(ans)}</div>
      <i class="bi bi-check-circle-fill" style="opacity:0; color: var(--primary); transition: opacity .2s;"></i>
    `;
    if (answers[currentIndex] === i) div.querySelector('i').style.opacity = '1';
    div.addEventListener('click', () => selectAnswer(i));
    answersContainer.appendChild(div);
  });

  document.getElementById('prevBtn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.innerHTML = currentIndex === questions.length - 1
    ? 'Завершить<i class="bi bi-check-lg ms-1"></i>'
    : 'Далее<i class="bi bi-arrow-right ms-1"></i>';

  const qc = document.getElementById('questionContainer');
  qc.classList.remove('fade-in'); void qc.offsetWidth; qc.classList.add('fade-in');
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ============================================================
   ВЫБОР / НАВИГАЦИЯ
   ============================================================ */
function selectAnswer(index) {
  if (quizFinished) return;
  answers[currentIndex] = index;
  document.querySelectorAll('#answersContainer .answer-option').forEach((el, i) => {
    el.classList.toggle('selected', i === index);
    const icon = el.querySelector('i');
    if (icon) icon.style.opacity = i === index ? '1' : '0';
  });
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
  else finishQuiz();
}
function prevQuestion() {
  if (currentIndex > 0) { currentIndex--; renderQuestion(); }
}

/* ============================================================
   ФИНИШ
   ============================================================ */
function finishQuiz() {
  if (quizFinished) return;
  quizFinished = true;
  clearInterval(timerInterval);

  const spent = Math.min(TIME_LIMIT, Math.round((Date.now() - quizStartTime) / 1000));
  let correct = 0;
  answers.forEach((a, i) => { if (a === questions[i].correct) correct++; });
  const total = questions.length;
  const percent = Math.round(correct / total * 100);

  document.getElementById('scoreValue').textContent = percent + '%';
  const circle = document.getElementById('resultCircle');
  setTimeout(() => {
    circle.style.background = `conic-gradient(var(--primary) 0deg, var(--accent) ${percent*3.6}deg, #eee ${percent*3.6}deg, #eee 360deg)`;
  }, 100);

  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = total - correct;
  const mm = Math.floor(spent / 60), ss = (spent % 60).toString().padStart(2, '0');
  document.getElementById('statTime').textContent = `${mm}:${ss}`;

  const msgEl = document.getElementById('resultMessage');
  const subEl = document.getElementById('resultSubtitle');
  let msg, sub, color;
  if (percent >= 90) { msg = '🏆 Превосходно!'; sub = 'Ты настоящий эксперт по C#!'; color = 'var(--success)'; launchConfetti(); }
  else if (percent >= 70) { msg = '🎉 Отличный результат!'; sub = 'Хорошие знания, продолжай практиковаться.'; color = 'var(--primary)'; launchConfetti(); }
  else if (percent >= 50) { msg = '👍 Неплохо!'; sub = 'Основы есть, стоит повторить материал.'; color = 'var(--warning)'; }
  else { msg = '📚 Нужно подтянуть теорию'; sub = 'Повтори основы C# и попробуй снова!'; color = 'var(--danger)'; }
  msgEl.textContent = msg; msgEl.style.color = color; subEl.textContent = sub;

  renderReview();
  showScreen('result');
}

function renderReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  questions.forEach((q, i) => {
    const ua = answers[i];
    const ok = ua === q.correct;
    const item = document.createElement('div');
    item.className = 'review-item' + (ok ? '' : ' fail');
    const userText = ua !== null ? `${letters[ua]}. ${q.answers[ua]}` : '— не выбран —';
    const correctText = `${letters[q.correct]}. ${q.answers[q.correct]}`;
    item.innerHTML = `
      <div class="review-icon ${ok ? 'ok' : 'no'}"><i class="bi bi-${ok ? 'check-lg' : 'x-lg'}"></i></div>
      <div class="flex-grow-1">
        <div class="review-q">${i + 1}. ${escapeHtml(q.q)}</div>
        <div class="review-a">Ваш ответ: ${escapeHtml(userText)}
          ${ok ? '' : `<br>Правильный: <span class="correct-ans">${escapeHtml(correctText)}</span>`}
        </div>
      </div>`;
    list.appendChild(item);
  });
}

function restartQuiz() { showScreen('start'); }

/* ============================================================
   КОНФЕТТИ
   ============================================================ */
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ['#6c5ce7','#00cec9','#a29bfe','#fdcb6e','#00b894','#e17055'];
  const pieces = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    w: 6 + Math.random() * 8, h: 8 + Math.random() * 8,
    color: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3,
    rot: Math.random() * Math.PI, vr: -0.15 + Math.random() * 0.3
  }));
  let frame = 0;
  (function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    });
    if (++frame < 260) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  })();
}

/* ============================================================
   КЛАВИАТУРА / RESIZE
   ============================================================ */
document.addEventListener('keydown', e => {
  if (!screens.quiz.classList.contains('active')) return;
  if (e.key === 'ArrowRight') nextQuestion();
  if (e.key === 'ArrowLeft') prevQuestion();
  const n = parseInt(e.key);
  if (n >= 1 && n <= 4) selectAnswer(n - 1);
});
addEventListener('resize', () => {
  const c = document.getElementById('confetti');
  c.width = innerWidth; c.height = innerHeight;
});
</script>
